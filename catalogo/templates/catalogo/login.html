<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ferretería Timbles</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'catalogo/css/style.css' %}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <img src="{% static 'catalogo/images/logo.jpg' %}" alt="Logo Timbles" class="login-logo">
            <h2>Ingreso al Sistema</h2>
            
            <!-- Si hay un error (contraseña incorrecta), lo mostramos aquí -->
            {% if error %}
                <div class="login-error">{{ error }}</div>
            {% endif %}
            
            <!-- Formulario que envía los datos por el método POST -->
            <form method="POST">
                <!-- Token de seguridad obligatorio en Django para formularios POST -->
                {% csrf_token %}
                <input type="text" name="usuario" placeholder="Usuario" required>
                <input type="password" name="contrasena" placeholder="Contraseña" required>
                <button type="submit" class="btn-login">Ingresar</button>
            </form>
            
            <div class="login-credentials">
                <p><strong>Admin:</strong> admin / admin</p>
                <p><strong>Cliente:</strong> cliente / cliente</p>
            </div>
            
            <a href="{% url 'landing' %}" class="login-back">← Volver al inicio</a>
        </div>
    </div>
</body>
</html>
